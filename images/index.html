
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>内灘町の紹介 - 完成版</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;color:#253746;background:#eef6fb}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;color:white;background:#196DAC}
h1{margin:0;font-size:1.3rem}h2{color:#196DAC;border-bottom:2px solid #196DAC}
.menu{border:0;color:white;background:transparent;font-size:25px;cursor:pointer}
nav{display:none;padding:10px 18px;color:white;background:#186845}nav.open{display:block}nav span{margin-right:20px}main{padding:18px}
.at{margin-top:8px;padding:11px;cursor:pointer;background:white;border:1px solid #186845}.ac{display:none;padding:11px;background:white;border:1px solid #186845;border-top:0}.ac.show{display:block}
.btn{margin:14px 0;padding:9px 14px;border:0;border-radius:4px;color:white;background:#186845;cursor:pointer}
.modal{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:#0008}.modal.show{display:flex}.modal-card{width:min(330px,90%);padding:22px;border-radius:8px;background:white;text-align:center}
.carousel{overflow:hidden;border-radius:7px}.track{display:flex;transition:.3s}.item{min-width:100%;padding:28px 10px;color:white;text-align:center;font-weight:bold}.controls button{margin-top:7px;padding:7px 11px;color:white;border:0;background:#253746;cursor:pointer}
</style>
</head>
<body>
<header><h1>内灘町の紹介</h1><button class="menu" onclick="toggleMenu()">≡</button></header>
<nav id="nav"><span>トップ</span><span>観光</span><span>特産品</span></nav>
<main><p>海と砂丘、河北潟に囲まれた町です。</p><h2>おすすめポイント</h2>
<div class="at" onclick="toggleAcc(this)">内灘海岸を見る ▼</div><div class="ac">日本海に沈む夕日と、広い砂浜を楽しめます。</div>
<div class="at" onclick="toggleAcc(this)">河北潟を見る ▼</div><div class="ac">干拓地では、酪農や農業が営まれています。</div>
<button class="btn" onclick="openModal()">重要なお知らせを見る</button><h2>内灘ハイライト</h2>
<div class="carousel"><div class="track" id="track"><div class="item" style="background:#196DAC">サンセットブリッジ内灘</div><div class="item" style="background:#186845">内灘餅</div><div class="item" style="background:#b68a3c">ミルク王国ウチナダ</div></div></div>
<div class="controls"><button onclick="move(-1)">前へ</button> <button onclick="move(1)">次へ</button></div></main>
<div class="modal" id="modal"><div class="modal-card"><h3>内灘町からのお知らせ</h3><p>詳細情報をここに表示します。</p><button class="btn" onclick="closeModal()">閉じる</button></div></div>
<script>
function toggleMenu(){document.getElementById('nav').classList.toggle('open')}
function toggleAcc(el){el.nextElementSibling.classList.toggle('show')}
function openModal(){document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
let current=0;function move(d){current=(current+d+3)%3;document.getElementById('track').style.transform='translateX(-'+current*100+'%)'}
</script></body></html>
